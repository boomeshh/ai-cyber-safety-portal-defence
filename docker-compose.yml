services:
  backend:
    build:
      context: ./backend
    container_name: rakshak-backend-service
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      RAKSHAK_TESTING: "0"
    volumes:
      - rakshak-evidence:/app/uploads
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://localhost:8000/", timeout=5)
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - rakshak-net

  frontend:
    build:
      context: ./user-frontend
    container_name: rakshak-frontend-service
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rakshak-net

networks:
  rakshak-net:
    driver: bridge

volumes:
  rakshak-evidence:
